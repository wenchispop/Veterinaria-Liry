<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Agenda una hora para la atención de tu mascota en Veterinaria Liry.">
	<title>Agendar Hora - Veterinaria Liry</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="css/estilo.css">
</head>
<body class="bg-light">

	<!-- El componente reutilizable inserta la navegación pública. -->
	<custom-navbar></custom-navbar>

	<!-- Contenido principal de la solicitud de atención veterinaria. -->
	<main class="container py-5">
		<div class="row justify-content-center">
			<div class="col-lg-9 col-xl-8">
				<div class="text-center mb-4">
					<p class="text-primary fw-semibold mb-2">ATENCIÓN PARA TU MASCOTA</p>
					<h1 class="fw-bold">Agenda tu hora</h1>
					<p class="text-muted mb-0">Completa tus datos y nos pondremos en contacto para confirmar la cita.</p>
				</div>

				<!-- La tarjeta agrupa todos los campos necesarios para agendar una hora. -->
				<div class="card border-0 shadow-sm">
					<div class="card-body p-4 p-md-5">
						<!-- Este formulario recopila los datos del tutor, la mascota y la consulta. -->
						<form id="appointmentForm">
							<!-- Datos de contacto de la persona responsable de la mascota. -->
							<fieldset class="mb-4">
								<legend class="h4 mb-3">Datos del tutor</legend>
								<div class="row g-3">
									<div class="col-md-6">
										<label for="ownerName" class="form-label">Nombre completo</label>
										<input type="text" class="form-control" id="ownerName" name="ownerName" autocomplete="name" required>
									</div>
									<div class="col-md-6">
										<label for="ownerEmail" class="form-label">Correo electrónico</label>
										<input type="email" class="form-control" id="ownerEmail" name="ownerEmail" autocomplete="email" placeholder="nombre@correo.cl" required>
									</div>
									<div class="col-md-6">
										<label for="ownerPhone" class="form-label">Teléfono</label>
										<input type="tel" class="form-control" id="ownerPhone" name="ownerPhone" autocomplete="tel" placeholder="9 1234 5678" required>
									</div>
								</div>
							</fieldset>

							<!-- Información básica de la mascota que recibirá atención. -->
							<fieldset class="mb-4">
								<legend class="h4 mb-3">Datos de la mascota</legend>
								<div class="row g-3">
									<div class="col-md-6">
										<label for="petName" class="form-label">Nombre de la mascota</label>
										<input type="text" class="form-control" id="petName" name="petName" required>
									</div>
									<div class="col-md-6">
										<label for="petType" class="form-label">Tipo de mascota</label>
										<select class="form-select" id="petType" name="petType" required>
											<option value="" selected disabled>Selecciona una opción</option>
											<option value="perro">Perro</option>
											<option value="gato">Gato</option>
											<option value="otro">Otro</option>
										</select>
									</div>
								</div>
							</fieldset>

							<!-- Servicio, fecha, hora y motivo de la visita veterinaria. -->
							<fieldset class="mb-4">
								<legend class="h4 mb-3">Detalles de la consulta</legend>
								<div class="row g-3">
									<div class="col-md-6">
										<label for="service" class="form-label">Servicio</label>
										<select class="form-select" id="service" name="service" required>
											<option value="" selected disabled>Selecciona un servicio</option>
											<option value="consulta">Consulta veterinaria</option>
											<option value="vacunacion">Vacunación</option>
											<option value="control">Control preventivo</option>
											<option value="peluqueria">Peluquería y baño</option>
											<option value="urgencia">Urgencia</option>
										</select>
									</div>
									<div class="col-md-3">
										<label for="appointmentDate" class="form-label">Fecha</label>
										<input type="date" class="form-control" id="appointmentDate" name="appointmentDate" required>
									</div>
									<div class="col-md-3">
										<label for="appointmentTime" class="form-label">Hora</label>
										<select class="form-select" id="appointmentTime" name="appointmentTime" required>
											<option value="" selected disabled>Hora</option>
											<option>09:00</option>
											<option>10:00</option>
											<option>11:00</option>
											<option>12:00</option>
											<option>15:00</option>
											<option>16:00</option>
											<option>17:00</option>
											<option>18:00</option>
										</select>
									</div>
									<div class="col-12">
										<label for="reason" class="form-label">Motivo de la consulta <span class="text-muted">(opcional)</span></label>
										<textarea class="form-control" id="reason" name="reason" rows="3" placeholder="Cuéntanos brevemente cómo podemos ayudar.  "></textarea>
									</div>
								</div>
							</fieldset>

							<!-- El tutor debe aceptar el uso de sus datos para coordinar la cita. -->
							<div class="form-check mb-4">
								<input class="form-check-input" type="checkbox" id="privacyConsent" required>
								<label class="form-check-label" for="privacyConsent">Acepto que Veterinaria Liry use estos datos para coordinar mi hora.</label>
							</div>

							<button type="submit" class="btn btn-primary w-100 py-2">Solicitar hora</button>
							<div id="appointmentMessage" class="alert alert-success mt-4 mb-0 d-none" role="status">
								Tu solicitud fue registrada. Te contactaremos para confirmar la hora.
							</div>
						</form>
					</div>
				</div>

			</div>
		</div>
	</main>

	<!-- El componente reutilizable inserta el pie de página. -->
	<custom-footer></custom-footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<!-- Registra los componentes del layout. -->
	<script src="js/Componentes/layout.js"></script>
</body>
</html>
