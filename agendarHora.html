<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Agenda una hora para la atención de tu mascota en Veterinaria Liry.">
	<title>Agendar Hora - Veterinaria Liry</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="css/estilo.css">
</head>
<body class="bg-light">

	
	<!-- El componente reutilizable inserta la navegación pública. -->
	<custom-navbar></custom-navbar>

	<!-- Contenido principal de la solicitud de atención veterinaria. -->
	<main class="container py-5">
		<div class="row justify-content-center">
			<div class="col-lg-9 col-xl-8">
				<div class="text-center mb-4">
					<p class="text-primary fw-semibold mb-2">ATENCIÓN PARA TU MASCOTA</p>
					<h1 class="fw-bold">Agenda tu hora</h1>
					<p class="text-muted mb-0">Completa tus datos y nos pondremos en contacto para confirmar la cita.</p>
				</div>

				<!-- La tarjeta agrupa todos los campos necesarios para agendar una hora. -->
				<div class="card border-0 shadow-sm">
					<div class="card-body p-4 p-md-5">
						<!-- Este formulario recopila los datos del tutor, la mascota y la consulta. -->
						<form id="appointmentForm">
							<!-- Datos de contacto de la persona responsable de la mascota. -->
							<fieldset class="mb-4">
								<legend class="h4 mb-3">Datos del tutor</legend>
								<div class="row g-3">
									<div class="col-md-6">
										<label for="ownerName" class="form-label">Nombre completo</label>
										<input type="text" class="form-control" id="NombreDueño">
									</div>
								</div>
							</fieldset>
							<!-- Servicio, fecha, hora y motivo de la visita veterinaria. -->
							<fieldset class="mb-4">
								<legend class="h4 mb-3">Detalles de la consulta</legend>
								<div class="row g-3">
										<label for="reason" class="form-label">Motivo de la consulta <span class="text-muted">(opcional)</span></label>
										<textarea class="form-control" id="reason" name="reason" rows="3" placeholder="Cuéntanos brevemente cómo podemos ayudar.  "></textarea>
								</div>
							</fieldset>
							<button type="submit" class="btn btn-primary w-100 py-2">Solicitar hora</button>
						</form>
					</div>
				</div>

			</div>
		</div>
	</main>

	<!-- El componente reutilizable inserta el pie de página. -->
	<custom-footer></custom-footer>

	<!-- Registra los componentes del layout. -->
	<script src="js/Componentes/layout.js"></script>
</body>
</html>
