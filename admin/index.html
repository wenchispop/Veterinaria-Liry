<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Administración - Veterinaria Liry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
    <!-- ===== NAVBAR ===== -->
    <!-- Esta barra permite navegar entre el inicio, usuarios, citas y cierre de sesión. -->
    <!-- El componente administrativo inserta el menú común de esta carpeta. -->
    <custom-navbaradmin></custom-navbaradmin>

    <!-- ==================== CUERPO PRINCIPAL ==================== -->
    <!-- Zona principal donde el administrador consulta el resumen del sistema. -->
    <div class="container-fluid">
        <div class="row">
            <!-- Usamos p-4 para padding y bg-light para fondo claro -->
            <!-- Estas clases de Bootstrap agregan separación y un fondo claro al panel. -->
            <main class="ms-sm-auto px-md-4 py-4 bg-light">

                <h1 class="mb-4">📊 Panel de Administración</h1>
                <p class="text-muted">Bienvenido, Aquí puedes gestionar usuarios y citas.</p>

                <!-- Tarjetas de resumen (estadísticas) -->
                <!-- Las tarjetas muestran la cantidad de usuarios y citas registradas. -->
                <div class="row g-4 mb-4">
                    <div class="col-md-6"> <!-- Cambio a 6 para que ocupen más ancho -->
                        <div class="card border-start border-4 border-warning"> <!-- Borde izquierdo con Bootstrap -->
                            <div class="card-body">
                                <h5 class="card-title">👥 Usuarios</h5>
                                <p class="card-text display-6" id="total-usuarios">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card border-start border-4 border-warning">
                            <div class="card-body">
                                <h5 class="card-title">📅 Citas</h5>
                                <p class="card-text display-6" id="total-citas">0</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Actividad reciente -->
                <!-- Esta lista queda preparada para mostrar las últimas acciones realizadas. -->
                <div class="card">
                    <div class="card-header bg-primary text-white">📋 Últimas actividades</div>
                    <div class="card-body">
                        <ul class="list-group list-group-flush" id="actividades-recientes">
                            <li class="list-group-item">No hay actividad reciente.</li>
                        </ul>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <!-- Pie de página del panel de administración. -->
    <custom-footer></custom-footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Registra el navbar administrativo y el footer reutilizable. -->
    <script src="../js/Componentes/layout.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
