<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Veterinaria Liry</title>
    <!-- Bootstrap 5-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <!-- Menú de navegación para acceder a las distintas secciones del sitio. -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-background">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                Veterinaria Liry
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tienda.html">Tienda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">🔑 Iniciar Sesión</a></li>
                    <li class="nav-item">
                        <a class="nav-link active" href="carrito.html">
                            🛒 Carrito
                            <span id="cart-count" class="badge bg-warning text-dark">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ===== FORMULARIO DE LOGIN ===== -->
    <!-- Esta sección contiene los campos que permiten iniciar sesión en el sistema. -->
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="card bg-secondary p-4" style="width: 100%; max-width: 400px;">
            <h2 class="text-center mb-4">Iniciar Sesión</h2>

            <!-- Credenciales de prueba (mock) -->
            <!-- Estos datos sirven para probar los roles de administrador y vendedor. -->
            <div class="alert alert-secondary text-dark small">
                <strong>Usuarios de prueba:</strong><br>
                admin@tienda.cl / 1234<br>
                vendedor@tienda.cl / 1234
            </div>

            <!-- FORMULARIO -->
            <!-- El formulario recopila el correo y la contraseña del usuario. -->
            <form id="loginForm">
                <div class="mb-3">
                    <label for="input-email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="input-email" placeholder="ejemplo@tienda.cl" required>
                </div>
                <div class="mb-3">
                    <label for="input-password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="input-password" placeholder="****" required>
                </div>
                <!-- Botón con id para enlazar con JS -->
                <button type="button" id="btn-inicio-sesion" class="btn btn-primary w-100">Ingresar</button>
            </form>

            <!-- Mensaje de error (se muestra desde JS) -->
            <!-- JavaScript utiliza este espacio para informar si los datos son incorrectos. -->
            <div id="loginError" class="text-danger mt-3 text-center" style="display: none;">
                ❌ Credenciales incorrectas. Intenta nuevamente.
            </div>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <!-- Pie de página con la información de derechos reservados. -->
    <footer class="navbar-background text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">© 2026 Veterinaria Liry - Todos los derechos reservados</p>
        </div>
    </footer>

    <!-- Bootstrap permite que la navegación funcione correctamente en dispositivos móviles. -->
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
        <!-- Actualiza el contador del carrito aunque el usuario esté en la página de login. -->
        <script src="js/main.js"></script>

</body>
</html>
