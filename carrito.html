<!DOCTYPE html>
<html lang="es">
<head>
	<!-- Configuración básica de la página y adaptación a dispositivos móviles. -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Carrito - Veterinaria Liry</title>
	<!-- Bootstrap proporciona la estructura responsive y los estilos de los componentes. -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Estilos propios compartidos por el sitio. -->
	<link rel="stylesheet" href="css/estilo.css">
</head>
<body class="bg-light">

	<!-- ===== NAVBAR ===== -->
	<!-- Esta barra permite volver al inicio, visitar la tienda o iniciar sesión. -->
	<custom-navbar></custom-navbar>

	<!-- ===== CONTENIDO PRINCIPAL ===== -->
	<!-- Esta sección muestra los productos seleccionados y el total de la compra. -->
	<main class="container py-5">
		<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
			<div>
				<h1 class="mb-1">🛒 Mi carrito</h1>
				<p class="text-muted mb-0">Revisa los productos antes de finalizar tu compra.</p>
			</div>
			<!-- Permite eliminar todos los productos guardados. -->
			<button id="clear-cart" class="btn btn-outline-danger">Vaciar carrito</button>
		</div>

		<div class="row g-4">
			<div class="col-lg-8">
				<!-- JavaScript inserta aquí cada producto guardado. -->
				<div id="cart-items" class="list-group shadow-sm"></div>
				<!-- Mensaje visible cuando no existen productos en el carrito. -->
				<div id="empty-cart" class="alert alert-info text-center d-none mt-3">
					Tu carrito está vacío. Visita la tienda para agregar productos.
				</div>
			</div>

			<div class="col-lg-4">
				<!-- Resumen de precios y botón para confirmar la compra. -->
				<div class="card shadow-sm">
					<div class="card-body">
						<h2 class="h4">Resumen de compra</h2>
						<hr>
						<div class="d-flex justify-content-between fs-5">
							<span>Total</span>
							<strong id="cart-total">$0</strong>
						</div>
						<button id="checkout-button" class="btn btn-primary w-100 mt-4">Finalizar compra</button>
						<a href="tienda.html" class="btn btn-outline-secondary w-100 mt-2">Continuar comprando</a>
					</div>
				</div>
			</div>
		</div>
	</main>

	<!-- ===== FOOTER ===== -->
	<!-- Pie de página con la información de la veterinaria. -->
	<custom-footer></custom-footer>

	<!-- Bootstrap habilita el menú responsive. -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<!-- Registra los componentes reutilizables del layout. -->
	<script src="js/Componentes/layout.js"></script>
	<!-- Script propio que lee y actualiza los productos del carrito. -->
	<script src="js/main.js"></script>
</body>
</html>
